<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Vocab Defender - Co-Op</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #050510;
            color: #fff;
            overflow: hidden;
            touch-action: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 1000px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #020111 0%, #20124d 100%);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-text { text-shadow: 2px 2px 0px #000; font-size: 1rem; }
        @media (min-width: 768px) { .hud-text { font-size: 1.5rem; } }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        .btn {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: black;
            border: 4px solid #166534;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 8px;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 6px 0 #14532d;
            text-transform: uppercase;
            width: 100%;
            max-width: 300px;
        }

        .btn.blue {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border-color: #1e3a8a;
            box-shadow: 0 6px 0 #1e3a8a;
        }

        .btn.purple {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            border-color: #581c87;
            box-shadow: 0 6px 0 #4c1d95;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 transparent;
        }

        .btn:disabled {
            background: #6b7280;
            border-color: #374151;
            box-shadow: 0 6px 0 #1f2937;
            cursor: not-allowed;
            color: #9ca3af;
        }

        .title-text {
            color: #60a5fa;
            text-shadow: 4px 4px 0px #1e3a8a, 0 0 20px rgba(96, 165, 250, 0.8);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        
        .inst-text { font-size: 0.8rem; line-height: 1.8; color: #d1d5db; max-width: 90%; }
        @media (min-width: 768px) { .title-text { font-size: 3rem; } .inst-text { font-size: 1rem; } }

        /* Mobile controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            color: white;
            font-size: 24px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active { background: rgba(255, 255, 255, 0.4); }
        #shoot-btn { width: 70px; height: 70px; border-radius: 10px; background: rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.6); }
        @media (min-width: 768px) { #mobile-controls { display: none; } }

        .input-box {
            background: #111827;
            border: 2px solid #3b82f6;
            color: #60a5fa;
            font-family: inherit;
            font-size: 1.5rem;
            padding: 10px;
            text-align: center;
            width: 200px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="flex justify-between w-full">
                <div class="hud-text text-green-400">SCORE:<span id="scoreVal">0</span></div>
                <div class="hud-text text-blue-400" id="room-code-display"></div>
                <div class="hud-text text-red-400">LIVES:<span id="livesVal">3</span></div>
            </div>
            <div id="feedback-msg" class="text-center font-bold text-xl md:text-2xl transition-opacity duration-300 opacity-0" style="text-shadow: 2px 2px #000;"></div>
            <div></div>
        </div>

        <!-- Main Menu -->
        <div id="start-screen" class="overlay">
            <h1 class="title-text">MATH VOCAB<br>DEFENDER</h1>
            <div class="inst-text mb-4">
                <p class="text-green-400 mb-2">SHOOT: Math Vocabulary Words</p>
                <p class="text-red-400 mb-4">AVOID: Everyday Words</p>
            </div>
            
            <div id="auth-loading" class="text-yellow-400 mb-4 animate-pulse">Connecting to servers...</div>

            <div id="menu-buttons" class="hidden flex-col items-center w-full">
                <button id="btn-single" class="btn mb-2">SINGLE PLAYER</button>
                <button id="btn-host" class="btn blue mb-2">HOST CO-OP</button>
                <button id="btn-join" class="btn purple">JOIN CO-OP</button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="overlay hidden">
            <h1 class="title-text text-blue-400">CO-OP LOBBY</h1>
            <p class="mb-4">Give this code to your partner:</p>
            <div id="lobby-code" class="text-4xl text-yellow-400 mb-8 tracking-widest bg-gray-800 p-4 rounded border-2 border-gray-600">----</div>
            <p class="text-green-400 animate-pulse mb-8">Waiting for player 2 to join...</p>
            <button id="btn-cancel-host" class="btn text-sm p-3">CANCEL</button>
        </div>

        <!-- Join Screen -->
        <div id="join-screen" class="overlay hidden">
            <h1 class="title-text text-purple-400">JOIN CO-OP</h1>
            <p class="mb-4">Enter Room Code:</p>
            <input type="text" id="join-input" class="input-box" maxlength="4" placeholder="ABCD" autocomplete="off">
            <div id="join-error" class="text-red-400 mb-4 h-6"></div>
            <button id="btn-connect" class="btn purple mb-4">CONNECT</button>
            <button id="btn-cancel-join" class="btn text-sm p-3">CANCEL</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 class="title-text text-red-500" style="text-shadow: 4px 4px 0px #7f1d1d, 0 0 20px rgba(239, 68, 68, 0.8);">MISSION FAILED</h1>
            <p class="text-xl md:text-2xl mb-2">FINAL SCORE</p>
            <p id="final-score" class="text-4xl md:text-6xl text-yellow-400 mb-8" style="text-shadow: 3px 3px #000;">0</p>
            <button id="restart-btn" class="btn">MAIN MENU</button>
        </div>

        <div id="mobile-controls" class="hidden">
            <div class="flex gap-4">
                <div id="left-btn" class="control-btn">&#9664;</div>
                <div id="right-btn" class="control-btn">&#9654;</div>
            </div>
            <div id="shoot-btn" class="control-btn">&#9650;</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'math-defender-app';
        let db, auth;
        let currentUser = null;

        // Multiplayer State
        let isMultiplayer = false;
        let isHost = false;
        let activeRoomId = null;
        let playerNum = 1; // 1 for host, 2 for client
        let roomUnsubscribe = null;
        let lastSyncTime = 0;

        // Initialize Firebase
        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            
            if (token) {
                await signInWithCustomToken(auth, token);
            } else {
                await signInAnonymously(auth);
            }
            currentUser = auth.currentUser;
            
            document.getElementById('auth-loading').classList.add('hidden');
            document.getElementById('menu-buttons').classList.remove('hidden');
            document.getElementById('menu-buttons').classList.add('flex');
            
        } catch (e) {
            console.error("Firebase init failed, falling back to single player only", e);
            document.getElementById('auth-loading').textContent = "Offline Mode";
            setTimeout(() => {
                document.getElementById('auth-loading').classList.add('hidden');
                document.getElementById('menu-buttons').classList.remove('hidden');
                document.getElementById('menu-buttons').classList.add('flex');
                document.getElementById('btn-host').classList.add('hidden');
                document.getElementById('btn-join').classList.add('hidden');
            }, 1000);
        }

        function getRoomRef(roomId) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId.toUpperCase());
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = '';
            for(let i=0; i<4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        // Setup UI Handlers for Multiplayer
        document.getElementById('btn-single').addEventListener('click', async () => {
            isMultiplayer = false;
            await initGame();
        });

        document.getElementById('btn-host').addEventListener('click', async () => {
            if(!currentUser) return;
            const code = generateRoomCode();
            activeRoomId = code;
            isHost = true;
            playerNum = 1;
            isMultiplayer = true;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-code').textContent = code;

            const roomRef = getRoomRef(code);
            await setDoc(roomRef, {
                status: 'waiting',
                seed: Math.floor(Math.random() * 1000000),
                score: 0,
                lives: 3,
                hostId: currentUser.uid,
                p1: { x: window.innerWidth / 2, lastShoot: 0 },
                p2: { x: window.innerWidth / 2, lastShoot: 0, joined: false }
            });

            listenToRoom(roomRef);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('join-screen').classList.remove('hidden');
            document.getElementById('join-error').textContent = '';
            document.getElementById('join-input').value = '';
            document.getElementById('join-input').focus();
        });

        document.getElementById('btn-connect').addEventListener('click', async () => {
            if(!currentUser) return;
            const code = document.getElementById('join-input').value.toUpperCase();
            if (code.length !== 4) return;
            
            const btn = document.getElementById('btn-connect');
            btn.disabled = true;
            btn.textContent = 'CONNECTING...';

            const roomRef = getRoomRef(code);
            const docSnap = await getDoc(roomRef);

            if (docSnap.exists() && docSnap.data().status === 'waiting') {
                activeRoomId = code;
                isHost = false;
                playerNum = 2;
                isMultiplayer = true;
                
                await updateDoc(roomRef, {
                    status: 'playing',
                    'p2.joined': true
                });
                
                listenToRoom(roomRef);
            } else {
                document.getElementById('join-error').textContent = 'Room not found or full.';
                btn.disabled = false;
                btn.textContent = 'CONNECT';
            }
        });

        document.getElementById('btn-cancel-host').addEventListener('click', () => cancelMultiplayer());
        document.getElementById('btn-cancel-join').addEventListener('click', () => {
            document.getElementById('join-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            cancelMultiplayer();
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        function cancelMultiplayer() {
            if (roomUnsubscribe) roomUnsubscribe();
            roomUnsubscribe = null;
            if (activeRoomId && isHost) {
                // Optionally delete room doc or set to cancelled, ignoring for simplicity
            }
            activeRoomId = null;
            isMultiplayer = false;
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('join-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('btn-connect').disabled = false;
            document.getElementById('btn-connect').textContent = 'CONNECT';
        }


        // Deteminsitic Random Generator
        let randomSeed = 1;
        function setSeed(s) { randomSeed = s; }
        function random() {
            let x = Math.sin(randomSeed++) * 10000;
            return x - Math.floor(x);
        }

        // Global Graphics and Logic Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreVal');
        const livesEl = document.getElementById('livesVal');
        const feedbackMsg = document.getElementById('feedback-msg');
        
        let gameState = 'MENU'; 
        let score = 0;
        let lives = 3;
        let animationId;
        let lastTime = 0;
        let frameCount = 0; // Deterministic frame counter for spawning

        const mathWords = [
            "ALGEBRA", "GEOMETRY", "FRACTION", "DECIMAL", "EQUATION", 
            "VARIABLE", "POLYGON", "INTEGER", "RADIUS", "DIAMETER",
            "SYMMETRY", "QUOTIENT", "PRODUCT", "SUM", "DIFFERENCE"
        ];
        const nonMathWords = [
            "APPLE", "GUITAR", "OCEAN", "CHAIR", "CLOUD",
            "BICYCLE", "RIVER", "MOUNTAIN", "WINDOW", "TIGER",
            "PLANET", "FOREST", "CASTLE", "ROCKET", "SHOE"
        ];

        // --- Audio System (Tone.js) ---
        let audioInitialized = false;
        let laserSynth, goodSynth, badSynth, gameOverSynth, bgmSynth, bgmSequence;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            laserSynth = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, oscillator: { type: 'sine' }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            goodSynth = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            badSynth = new Tone.MembraneSynth({ pitchDecay: 0.1, octaves: 2, oscillator: { type: 'sawtooth' }, envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 } }).toDestination();
            gameOverSynth = new Tone.FMSynth({ harmonicity: 0.5, modulationIndex: 1.2, oscillator: { type: 'sawtooth' }, envelope: { attack: 0.1, decay: 0.5, sustain: 0.1, release: 1 } }).toDestination();
            bgmSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }, volume: -15 }).toDestination();
            
            const bassline = ["C3", "C3", "Eb3", "C3", "F3", "C3", "Eb3", "C3", "Ab2", "Ab2", "C3", "Ab2", "Bb2", "Bb2", "D3", "Bb2"];
            bgmSequence = new Tone.Sequence((time, note) => bgmSynth.triggerAttackRelease(note, "16n", time), bassline, "8n");
            Tone.Transport.bpm.value = 150;
            audioInitialized = true;
        }

        function playLaserSound() { if (audioInitialized) laserSynth.triggerAttackRelease("C6", "32n"); }
        function playGoodSound() { if (audioInitialized) { goodSynth.triggerAttackRelease("E5", "16n"); setTimeout(() => goodSynth.triggerAttackRelease("G5", "16n"), 100); } }
        function playBadSound() { if (audioInitialized) badSynth.triggerAttackRelease("C2", "8n"); }
        function playGameOverSound() { if (audioInitialized) { gameOverSynth.triggerAttackRelease("C3", "4n"); setTimeout(() => gameOverSynth.triggerAttackRelease("C2", "1n"), 300); } }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Ensure ships stay above bottom on resize
            if(ship1) ship1.y = canvas.height - 60;
            if(ship2) ship2.y = canvas.height - 60;
        }
        window.addEventListener('resize', resizeCanvas);


        class Ship {
            constructor(color, num) {
                this.x = canvas.width / 2;
                this.y = canvas.height - 60;
                this.width = 40;
                this.height = 40;
                this.speed = 5;
                this.dx = 0;
                this.color = color;
                this.num = num;
                this.targetX = this.x; // For multiplayer smoothing
                this.lastShootTime = 0;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -this.height/2);
                ctx.lineTo(this.width/2, this.height/2);
                ctx.lineTo(0, this.height/4);
                ctx.lineTo(-this.width/2, this.height/2);
                ctx.closePath();
                ctx.fill();
                
                // Thrust
                if (random() > 0.5 && gameState === 'PLAYING') {
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.moveTo(-10, this.height/4);
                    ctx.lineTo(0, this.height/4 + 15 + random()*10);
                    ctx.lineTo(10, this.height/4);
                    ctx.closePath();
                    ctx.fill();
                }
                
                // Player ID marker
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '10px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillText(`P${this.num}`, 0, this.height/2 + 15);
                ctx.restore();
            }
            update(isLocal) {
                if (isLocal) {
                    this.x += this.dx;
                    if (this.x - this.width/2 < 0) this.x = this.width/2;
                    if (this.x + this.width/2 > canvas.width) this.x = canvas.width - this.width/2;
                } else {
                    // Smooth interpolate remote player
                    this.x += (this.targetX - this.x) * 0.2;
                }
                this.y = canvas.height - 60;
            }
        }

        let ship1, ship2;
        let localShip, remoteShip;

        const lasers = [];
        class Laser {
            constructor(x, y, ownerNum) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 15;
                this.speed = 8;
                this.color = ownerNum === 1 ? '#60a5fa' : '#4ade80'; // Match ship color
                this.ownerNum = ownerNum;
                this.markedForDeletion = false;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.markedForDeletion = true;
            }
        }

        const enemies = [];
        class WordEnemy {
            constructor() {
                this.isMathWord = random() > 0.4; 
                const list = this.isMathWord ? mathWords : nonMathWords;
                this.text = list[Math.floor(random() * list.length)];
                
                this.fontSize = window.innerWidth < 768 ? 14 : 18;
                ctx.font = `${this.fontSize}px 'Press Start 2P'`;
                this.width = ctx.measureText(this.text).width + 20;
                this.height = this.fontSize + 20;
                
                this.x = random() * (canvas.width - this.width) + this.width/2;
                this.y = -50;
                // Consistent speed based on deterministic frame count
                this.speed = (random() * 1.5 + 1) * (1 + (frameCount/5000)); 
                
                this.markedForDeletion = false;
                this.angle = 0;
                this.angleSpeed = random() * 0.1 - 0.05;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                this.angle += this.angleSpeed;
                ctx.rotate(Math.sin(this.angle) * 0.1);

                ctx.fillStyle = 'rgba(30, 58, 138, 0.6)';
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2;
                
                const r = 5, w = this.width, h = this.height, x = -w/2, y = -h/2;
                ctx.beginPath();
                ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = `${this.fontSize}px 'Press Start 2P'`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height + 50) {
                    this.markedForDeletion = true;
                    if (this.isMathWord) {
                        // Only Host handles out of bounds logic in multiplayer
                        if (!isMultiplayer || isHost) {
                            loseLifeLocal();
                        }
                    }
                }
            }
        }

        const particles = [];
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.size = random() * 3 + 1;
                this.speedX = random() * 6 - 3; this.speedY = random() * 6 - 3;
                this.color = color; this.life = 1; this.decay = random() * 0.05 + 0.02;
            }
            update() { this.x += this.speedX; this.y += this.speedY; this.life -= this.decay; }
            draw() {
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        const stars = [];
        function initStars() {
            stars.length = 0;
            for(let i=0; i<100; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 1 + 0.1 });
            }
        }


        function listenToRoom(roomRef) {
            if (roomUnsubscribe) roomUnsubscribe();
            
            roomUnsubscribe = onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                // Handle Lobby -> Game transition
                if (gameState === 'MENU' && data.status === 'playing') {
                    document.getElementById('lobby-screen').classList.add('hidden');
                    document.getElementById('join-screen').classList.add('hidden');
                    setSeed(data.seed);
                    initGame(true); // Start game with multiplayer flag
                }

                // Sync during gameplay
                if (gameState === 'PLAYING') {
                    // Update remote player state
                    if (isMultiplayer && remoteShip) {
                        const remoteData = isHost ? data.p2 : data.p1;
                        if (remoteData) {
                            remoteShip.targetX = remoteData.x;
                            // Check for remote shoot event
                            if (remoteData.lastShoot > remoteShip.lastShootTime) {
                                remoteShip.lastShootTime = remoteData.lastShoot;
                                lasers.push(new Laser(remoteShip.x, remoteShip.y - remoteShip.height/2, remoteShip.num));
                                playLaserSound();
                            }
                        }
                    }

                    // Sync Score and Lives (if they are newer/different)
                    if (data.score !== score) {
                        score = data.score;
                        scoreEl.textContent = score;
                    }
                    if (data.lives !== lives) {
                        lives = data.lives;
                        livesEl.textContent = lives;
                        if (lives <= 0 && gameState !== 'GAMEOVER') triggerGameOverLocal();
                    }
                    
                    if (data.status === 'gameover' && gameState !== 'GAMEOVER') {
                        triggerGameOverLocal();
                    }
                }
            }, (error) => {
                console.error("Firestore sync error:", error);
            });
        }

        async function syncStateToFirestore() {
            if (!isMultiplayer || !activeRoomId || gameState !== 'PLAYING') return;
            const now = Date.now();
            if (now - lastSyncTime < 100) return; // Sync rate limit (~10x a sec)
            lastSyncTime = now;

            try {
                const roomRef = getRoomRef(activeRoomId);
                const pKey = isHost ? 'p1' : 'p2';
                await updateDoc(roomRef, {
                    [`${pKey}.x`]: localShip.x,
                    [`${pKey}.lastShoot`]: localShip.lastShootTime
                });
            } catch (e) { console.error("Write error:", e); }
        }

        async function syncScoreLivesToFirestore() {
            if (!isMultiplayer || !activeRoomId) return;
            try {
                const roomRef = getRoomRef(activeRoomId);
                await updateDoc(roomRef, { score: score, lives: lives });
            } catch (e) {}
        }
        
        async function syncGameOverToFirestore() {
            if (!isMultiplayer || !activeRoomId) return;
            try {
                const roomRef = getRoomRef(activeRoomId);
                await updateDoc(roomRef, { status: 'gameover' });
            } catch (e) {}
        }


        function shootLocal() {
            localShip.lastShootTime = Date.now();
            lasers.push(new Laser(localShip.x, localShip.y - localShip.height/2, localShip.num));
            playLaserSound();
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) particles.push(new Particle(x, y, color));
        }

        function loseLifeLocal() {
            lives--;
            livesEl.textContent = lives;
            canvas.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
            setTimeout(() => { canvas.style.transform = 'translate(0, 0)'; }, 50);
            
            if (isMultiplayer) syncScoreLivesToFirestore();
            if (lives <= 0) triggerGameOverLocal();
        }

        function showFeedback(text, color) {
            feedbackMsg.textContent = text;
            feedbackMsg.style.color = color;
            feedbackMsg.style.opacity = '1';
            if(window.feedbackTimeout) clearTimeout(window.feedbackTimeout);
            window.feedbackTimeout = setTimeout(() => { feedbackMsg.style.opacity = '0'; }, 1000);
        }

        function checkCollisions() {
            lasers.forEach(laser => {
                enemies.forEach(enemy => {
                    if (laser.markedForDeletion || enemy.markedForDeletion) return;

                    if (laser.x > enemy.x - enemy.width/2 && laser.x < enemy.x + enemy.width/2 &&
                        laser.y > enemy.y - enemy.height/2 && laser.y < enemy.y + enemy.height/2) {
                        
                        laser.markedForDeletion = true;
                        enemy.markedForDeletion = true;
                        
                        // Check if it's THIS player's laser that hit
                        const isMyLaser = (!isMultiplayer) || (laser.ownerNum === localShip.num);

                        if (enemy.isMathWord) {
                            playGoodSound();
                            createExplosion(enemy.x, enemy.y, '#4ade80');
                            if (isMyLaser) {
                                score += 100;
                                scoreEl.textContent = score;
                                showFeedback("+100", "#4ade80");
                                if (isMultiplayer) syncScoreLivesToFirestore();
                            }
                        } else {
                            playBadSound();
                            createExplosion(enemy.x, enemy.y, '#ef4444');
                            if (isMyLaser) {
                                showFeedback("NOT MATH!", "#ef4444");
                                loseLifeLocal();
                            }
                        }
                    }
                });
            });

            // Ship collisions
            const ships = isMultiplayer ? [ship1, ship2] : [localShip];
            enemies.forEach(enemy => {
                 if (enemy.markedForDeletion) return;
                 ships.forEach(ship => {
                     const dx = ship.x - enemy.x;
                     const dy = ship.y - enemy.y;
                     if (Math.sqrt(dx * dx + dy * dy) < ship.width/2 + enemy.height/2) {
                         enemy.markedForDeletion = true;
                         playBadSound();
                         createExplosion(ship.x, ship.y, '#ef4444');
                         // Only deduct life if MY ship crashed
                         if (!isMultiplayer || ship.num === localShip.num) {
                            showFeedback("CRASH!", "#ef4444");
                            loseLifeLocal();
                         }
                     }
                 });
            });
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;
            
            // Fixed time step for deterministic logic
            if (!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            
            if (dt > 16) { // Target ~60fps logic updates
                lastTime = timestamp - (dt % 16);
                
                // --- UPDATE LOGIC ---
                frameCount++;
                
                // Background
                stars.forEach(star => {
                    star.y += star.speed;
                    if(star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
                });

                // Spawning
                let spawnRate = Math.max(60, 120 - Math.floor(frameCount / 600)); 
                if (frameCount % spawnRate === 0) enemies.push(new WordEnemy());

                // Entities
                if(ship1) ship1.update(ship1.num === playerNum || !isMultiplayer);
                if(ship2) ship2.update(ship2.num === playerNum);

                for (let i = lasers.length - 1; i >= 0; i--) {
                    lasers[i].update();
                    if (lasers[i].markedForDeletion) lasers.splice(i, 1);
                }
                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].update();
                    if (enemies[i].markedForDeletion) enemies.splice(i, 1);
                }
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                checkCollisions();
                syncStateToFirestore();
            }

            // --- RENDER LOGIC ---
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#020111'); gradient.addColorStop(1, '#20124d');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI*2); ctx.fill();
            });

            if(ship1) ship1.draw();
            if(ship2) ship2.draw();
            lasers.forEach(l => l.draw());
            enemies.forEach(e => e.draw());
            particles.forEach(p => p.draw());

            animationId = requestAnimationFrame(gameLoop);
        }


        async function initGame(multi = false) {
            await initAudio();
            resizeCanvas();
            initStars();
            
            score = 0; lives = 3; frameCount = 0; lastTime = 0;
            scoreEl.textContent = score; livesEl.textContent = lives;
            lasers.length = 0; enemies.length = 0; particles.length = 0;
            
            document.getElementById('start-screen').classList.add('hidden');
            if(window.innerWidth < 768) document.getElementById('mobile-controls').classList.remove('hidden');
            
            if (multi) {
                document.getElementById('room-code-display').textContent = `ROOM: ${activeRoomId}`;
                ship1 = new Ship('#60a5fa', 1); // Host (Blue)
                ship2 = new Ship('#4ade80', 2); // Client (Green)
                localShip = isHost ? ship1 : ship2;
                remoteShip = isHost ? ship2 : ship1;
            } else {
                setSeed(Math.random() * 1000); // Random seed for local
                document.getElementById('room-code-display').textContent = "";
                ship1 = new Ship('#60a5fa', 1);
                ship2 = null;
                localShip = ship1;
            }

            gameState = 'PLAYING';
            Tone.Transport.start();
            bgmSequence.start(0);
            requestAnimationFrame(gameLoop);
        }

        function triggerGameOverLocal() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            bgmSequence.stop(); Tone.Transport.stop(); playGameOverSound();
            cancelAnimationFrame(animationId);
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('mobile-controls').classList.add('hidden');
            
            if (isMultiplayer && isHost) syncGameOverToFirestore();
        }

        // Input Handling
        const keys = { ArrowLeft: false, ArrowRight: false, Space: false };
        window.addEventListener('keydown', (e) => {
            if(gameState !== 'PLAYING') return;
            if (e.code === 'ArrowLeft' || e.key === 'a') localShip.dx = -localShip.speed;
            if (e.code === 'ArrowRight' || e.key === 'd') localShip.dx = localShip.speed;
            if (e.code === 'Space' && !keys.Space) { keys.Space = true; shootLocal(); }
        });
        window.addEventListener('keyup', (e) => {
            if ((e.code === 'ArrowLeft' || e.key === 'a') && localShip.dx < 0) localShip.dx = 0;
            if ((e.code === 'ArrowRight' || e.key === 'd') && localShip.dx > 0) localShip.dx = 0;
            if (e.code === 'Space') keys.Space = false;
        });

        // Mobile Controls
        const lBtn = document.getElementById('left-btn'), rBtn = document.getElementById('right-btn'), sBtn = document.getElementById('shoot-btn');
        lBtn.addEventListener('touchstart', (e) => { e.preventDefault(); localShip.dx = -localShip.speed; });
        lBtn.addEventListener('touchend', (e) => { e.preventDefault(); if(localShip.dx < 0) localShip.dx = 0; });
        rBtn.addEventListener('touchstart', (e) => { e.preventDefault(); localShip.dx = localShip.speed; });
        rBtn.addEventListener('touchend', (e) => { e.preventDefault(); if(localShip.dx > 0) localShip.dx = 0; });
        sBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shootLocal(); });

        resizeCanvas();
        initStars();
        
        // Render simple background while in menu
        function menuLoop() {
            if (gameState !== 'MENU') return;
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#020111'); gradient.addColorStop(1, '#20124d');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI*2); ctx.fill();
                star.y += star.speed;
                if(star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
            });
            requestAnimationFrame(menuLoop);
        }
        menuLoop();

    </script>
</body>
</html>
