<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Vocab Defender - Co-Op</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    <!-- Robust, industry-standard secure CDN link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
    <style>
        @import url('https://googleapis.com');

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #050510;
            color: #fff;
            overflow: hidden;
            touch-action: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 1000px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #020111 0%, #20124d 100%);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-text { text-shadow: 2px 2px 0px #000; font-size: 1rem; }
        @media (min-width: 768px) { .hud-text { font-size: 1.5rem; } }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        .btn {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: black;
            border: 4px solid #166534;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 8px;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 6px 0 #14532d;
            text-transform: uppercase;
            width: 100%;
            max-width: 300px;
        }

        .btn.blue {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border-color: #1e3a8a;
            box-shadow: 0 6px 0 #1e3a8a;
        }

        .btn.purple {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            border-color: #581c87;
            box-shadow: 0 6px 0 #4c1d95;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 transparent;
        }

        .title-text {
            color: #60a5fa;
            text-shadow: 4px 4px 0px #1e3a8a, 0 0 20px rgba(96, 165, 250, 0.8);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        
        .inst-text { font-size: 0.8rem; line-height: 1.8; color: #d1d5db; max-width: 90%; }
        @media (min-width: 768px) { .title-text { font-size: 3rem; } .inst-text { font-size: 1rem; } }

        .input-box {
            background: #111827;
            border: 2px solid #3b82f6;
            color: #60a5fa;
            font-family: inherit;
            font-size: 1.1rem;
            padding: 10px;
            text-align: center;
            width: 260px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="flex justify-between w-full">
                <div class="hud-text text-green-400">SCORE:<span id="scoreVal">0</span></div>
                <div class="hud-text text-blue-400" id="room-code-display"></div>
                <div class="hud-text text-red-400">LIVES:<span id="livesVal">3</span></div>
            </div>
            <div id="feedback-msg" class="text-center font-bold text-xl md:text-2xl transition-opacity duration-300 opacity-0" style="text-shadow: 2px 2px #000;"></div>
            <div></div>
        </div>

        <!-- Main Menu -->
        <div id="start-screen" class="overlay">
            <h1 class="title-text">MATH VOCAB<br>DEFENDER</h1>
            <div class="inst-text mb-4">
                <p class="text-green-400 mb-2">SHOOT: Math Vocabulary Words</p>
                <p class="text-red-400 mb-4">AVOID: Everyday Words</p>
            </div>
            
            <div id="auth-loading" class="text-yellow-400 mb-4 animate-pulse">Connecting to servers...</div>

            <!-- Buttons start visible with fallback mechanics -->
            <div id="menu-buttons" class="flex flex-col items-center w-full hidden">
                <button id="btn-single" class="btn mb-2">SINGLE PLAYER</button>
                <button id="btn-host" class="btn blue mb-2">HOST CO-OP</button>
                <button id="btn-join" class="btn purple">JOIN CO-OP</button>
            </div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="overlay hidden">
            <h1 class="title-text text-blue-400">CO-OP LOBBY</h1>
            <p class="mb-4">Give this exact Room ID to your partner:</p>
            <div id="lobby-code" class="text-xs text-yellow-400 mb-8 break-all bg-gray-800 p-4 rounded border-2 border-gray-600 select-all font-sans">Connecting...</div>
            <p class="text-green-400 animate-pulse mb-8">Waiting for player 2 to join...</p>
            <button id="btn-cancel-host" class="btn text-sm p-3">CANCEL</button>
        </div>

        <!-- Join Screen -->
        <div id="join-screen" class="overlay hidden">
            <h1 class="title-text text-purple-400">JOIN CO-OP</h1>
            <p class="mb-4">Enter Partner's Room ID:</p>
            <input type="text" id="join-input" class="input-box font-sans text-sm" placeholder="Paste long ID here" autocomplete="off">
            <div id="join-error" class="text-red-400 mb-4 h-6 text-xs"></div>
            <button id="btn-connect" class="btn purple mb-4">CONNECT</button>
            <button id="btn-cancel-join" class="btn text-sm p-3">CANCEL</button>
        </div>
    </div>

    <script>
        const authLoading = document.getElementById('auth-loading');
        const menuButtons = document.getElementById('menu-buttons');
        
        let peer = null;
        let conn = null;
        let isHost = false;

        function initMultiplayer() {
            // Hard safety timer: If server signals take more than 2 seconds, drop the loading text and unlock menus automatically
            setTimeout(() => {
                showMenu();
            }, 2000);

            try {
                if (typeof Peer === 'undefined') {
                    console.warn("PeerJS library script failed to parse. Opening fallback mode.");
                    showMenu();
                    return;
                }

                // Initializing using secure cloud configuration mappings
                peer = new Peer({
                    host: '0.peerjs.com',
                    secure: true,
                    port: 443,
                    debug: 1
                });

                peer.on('open', (id) => {
                    console.log('Connected to handshaking broker. ID:', id);
                    const codeDisplay = document.getElementById('lobby-code');
                    if(codeDisplay) codeDisplay.innerText = id;
                    showMenu();
                });

                peer.on('error', (err) => {
                    console.error('Signalling Connection Flagged:', err);
                    showMenu(); 
                });

                peer.on('connection', (incomingConn) => {
                    conn = incomingConn;
                    setupConnection();
                });

            } catch (e) {
                console.error("Critical execution catch block hit.", e);
                showMenu();
            }
        }

        function showMenu() {
            if(authLoading) authLoading.classList.add('hidden');
            if(menuButtons) {
                menuButtons.classList.remove('hidden');
                menuButtons.style.setProperty('display', 'flex', 'important');
            }
        }

        // --- Action Bindings ---
        document.getElementById('btn-single').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            startGame(false);
        });

        document.getElementById('btn-host').addEventListener('click', () => {
            isHost = true;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            isHost = false;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('join-screen').classList.remove('hidden');
        });

        document.getElementById('btn-cancel-host').addEventListener('click', () => {
